name: Feature request
description: Suggest an improvement for the reusable template.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement.

        Please focus on reusable template behaviour rather than one-off personal customization.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the limitation or problem this feature would solve.
      placeholder: What is difficult, missing, or unclear today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain the behaviour you would like to see.
      placeholder: What should the template do differently?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any other approaches you considered.

  - type: textarea
    id: configuration-impact
    attributes:
      label: Configuration impact
      description: Explain whether this requires new fields or changes in `src/config/card.config.ts`.

  - type: textarea
    id: accessibility-impact
    attributes:
      label: Accessibility impact
      description: Note any keyboard, focus, contrast, labelling, or screen-reader considerations.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add mockups, examples, or links that help explain the request.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This request is relevant to the reusable template, not only to one personal card.
          required: true
